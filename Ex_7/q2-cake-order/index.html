<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cake Shop | Experiment 7</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="shop">
    <header class="top"><span>THE LITTLE</span><h1>CAKE SHOP</h1><p>Sweet moments, made to order.</p><small>Register No: URK24CS9026</small></header>
    <section class="cakes">
      <article class="cake"><div class="cake-art rainbow">🍭</div><h3>Color Cake</h3><p>₹300 each</p></article>
      <article class="cake"><div class="cake-art chocolate">🍫</div><h3>Brown Cake</h3><p>₹200 each</p></article>
      <article class="cake"><div class="cake-art vanilla">🍰</div><h3>Milky Cake</h3><p>₹250 each</p></article>
      <article class="cake"><div class="cake-art berry">🍒</div><h3>Black Forest</h3><p>₹350 each</p></article>
    </section>
    <section class="order">
      <h2>Place your order</h2>
      <label>Color Cake (Quantity)<input id="colorQty" type="number" min="0" value="2"></label>
      <label>Brown Cake (Quantity)<input id="brownQty" type="number" min="0" value="1"></label>
      <label>Milky Cake (Quantity)<input id="milkyQty" type="number" min="0" value="2"></label>
      <label>Black Forest Cake (Quantity)<input id="blackQty" type="number" min="0" value="1"></label>
      <button id="placeOrder">Place Order</button>
      <div class="total"><span>Total price</span><strong id="totalPrice">₹0</strong></div>
      <p id="message" role="status"></p>
    </section>
  </main>
</body>
</html>
