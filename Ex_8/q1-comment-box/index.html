<!DOCTYPE html>
<html lang="en" ng-app="commentApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comment Box | Experiment 8</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body ng-controller="CommentController">
  <main class="card">
    <header>
      <span class="tag">EXPERIMENT 08 · ANGULARJS</span>
      <h1>Comment Corner</h1>
      <p>Share a thought with the class.</p>
      <small>Register No: <strong>URK24CS9026</strong></small>
    </header>
    <form ng-submit="addComment()">
      <label for="comment">Your comment</label>
      <textarea id="comment" ng-model="newComment" placeholder="Write something..." required></textarea>
      <button type="submit">Post Comment</button>
    </form>
    <section class="comments">
      <h2>Comments <span class="count">{{ comments.length }}</span></h2>
      <p class="empty" ng-if="comments.length === 0">No comments yet. Be the first!</p>
      <div class="comment" ng-repeat="comment in comments track by $index">
        <p>{{ comment }}</p>
        <button class="remove" type="button" ng-click="removeComment($index)" aria-label="Remove comment">Remove</button>
      </div>
    </section>
  </main>
</body>
</html>
