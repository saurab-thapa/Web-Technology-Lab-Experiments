<!DOCTYPE html>
<html lang="en" ng-app="calculatorApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator | Experiment 8</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body ng-controller="CalculatorController">
  <main class="calculator">
    <header>
      <span class="tag">EXPERIMENT 08 · ANGULARJS</span>
      <h1>Simple Calculator</h1>
      <p>Choose an operation and see the result.</p>
      <small>Register No: <strong>URK24CS9026</strong></small>
    </header>
    <label for="num1">First number</label>
    <input id="num1" type="number" ng-model="a" placeholder="Enter first number">
    <label for="num2">Second number</label>
    <input id="num2" type="number" ng-model="b" placeholder="Enter second number">
    <label for="operator">Operation</label>
    <select id="operator" ng-model="operator">
      <option value="+">Addition (+)</option>
      <option value="-">Subtraction (−)</option>
      <option value="*">Multiplication (×)</option>
      <option value="/">Division (÷)</option>
    </select>
    <section class="result">
      <span>RESULT</span>
      <strong>{{ calculate() }}</strong>
    </section>
    <button type="button" class="clear" ng-click="clear()">Clear values</button>
  </main>
</body>
</html>
